<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18" />
      <stop offset="100%" stop-color="#141529" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C5E8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#stBgGrad)" />
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="#252536" stroke-width="2" />

  <!-- App Mockup -->
  <g transform="translate(140, 60)">
    <rect width="520" height="330" rx="16" fill="#11111D" stroke="#252536" stroke-width="2" />
    
    <!-- Header -->
    <rect width="520" height="44" rx="16" fill="#171727" />
    <rect y="28" width="520" height="16" fill="#171727" />
    <line x1="0" y1="44" x2="520" y2="44" stroke="#252536" stroke-width="1.5" />
    
    <!-- Dots -->
    <circle cx="25" cy="22" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="42" cy="22" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="59" cy="22" r="5" fill="#10B981" opacity="0.8" />
    <text x="260" y="27" fill="#9999AA" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" font-weight="500">
      Study Tools – Pomodoro &amp; Kanban Productivity
    </text>

    <!-- Left side: Pomodoro circular timer -->
    <g transform="translate(40, 70)">
      <rect width="180" height="220" rx="14" fill="#0C0D18" stroke="#252536" stroke-width="1" />
      
      <!-- Circular Progress -->
      <circle cx="90" cy="95" r="55" fill="none" stroke="#252536" stroke-width="8" />
      <circle cx="90" cy="95" r="55" fill="none" stroke="url(#circleGrad)" stroke-width="8" stroke-dasharray="345" stroke-dashoffset="90" stroke-linecap="round" />
      
      <text x="90" y="93" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="22" font-weight="700" text-anchor="middle">25:00</text>
      <text x="90" y="112" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">FOCUS TIME</text>
      
      <!-- Start Button -->
      <rect x="40" y="165" width="100" height="32" rx="16" fill="#20C5E8" />
      <text x="90" y="186" fill="#080812" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">START</text>
    </g>

    <!-- Right side: Tasks / Notes Kanban -->
    <g transform="translate(245, 70)">
      <rect width="235" height="220" rx="14" fill="#0C0D18" stroke="#252536" stroke-width="1" />
      <text x="20" y="32" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Tasks in Progress</text>
      <rect x="180" y="18" width="35" height="18" rx="9" fill="#252536" />
      <text x="197" y="31" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">3</text>
      
      <!-- Task 1 -->
      <rect x="15" y="48" width="205" height="46" rx="8" fill="#171727" stroke="#252536" stroke-width="1" />
      <rect x="25" y="60" width="8" height="8" rx="2" fill="#20C5E8" />
      <text x="42" y="68" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Review Spring Security JWT</text>
      <text x="42" y="83" fill="#9999AA" font-family="'Inter', sans-serif" font-size="9">Backend • High Priority</text>

      <!-- Task 2 -->
      <rect x="15" y="102" width="205" height="46" rx="8" fill="#171727" stroke="#252536" stroke-width="1" />
      <rect x="25" y="114" width="8" height="8" rx="2" fill="#10B981" />
      <text x="42" y="122" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Build React UI Component</text>
      <text x="42" y="137" fill="#9999AA" font-family="'Inter', sans-serif" font-size="9">Frontend • Completed</text>

      <!-- Task 3 -->
      <rect x="15" y="156" width="205" height="46" rx="8" fill="#171727" stroke="#252536" stroke-width="1" />
      <rect x="25" y="168" width="8" height="8" rx="2" fill="#F59E0B" />
      <text x="42" y="176" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Prepare Mock Interview Q&amp;A</text>
      <text x="42" y="191" fill="#9999AA" font-family="'Inter', sans-serif" font-size="9">Career • In progress</text>
    </g>
  </g>
</svg>

