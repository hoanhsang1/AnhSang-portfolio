<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="msBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a16" />
      <stop offset="100%" stop-color="#121326" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20C5E8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#msBgGrad)" />
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="#252536" stroke-width="2" />

  <!-- Background Architecture Circuit -->
  <g opacity="0.2" stroke="#20C5E8" stroke-width="1.5" stroke-dasharray="4,4">
    <path d="M 120,225 L 260,225" />
    <path d="M 380,225 L 470,120" />
    <path d="M 380,225 L 470,225" />
    <path d="M 380,225 L 470,330" />
    <path d="M 600,120 L 670,120" />
    <path d="M 600,225 L 670,225" />
    <path d="M 600,330 L 670,330" />
  </g>

  <!-- Client Node -->
  <g transform="translate(60, 185)">
    <rect width="90" height="80" rx="14" fill="#11111D" stroke="#252536" stroke-width="2" />
    <text x="45" y="38" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">⚡</text>
    <text x="45" y="60" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Clients</text>
  </g>

  <!-- API Gateway Node -->
  <g transform="translate(230, 160)">
    <rect width="140" height="130" rx="16" fill="#171727" stroke="#20C5E8" stroke-width="2" />
    <rect x="15" y="15" width="110" height="24" rx="6" fill="#20C5E8" opacity="0.2" />
    <text x="70" y="31" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">GATEWAY</text>
    <text x="70" y="66" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Spring Cloud</text>
    <text x="70" y="85" fill="#9999AA" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">JWT Filter &amp; Auth</text>
    <text x="70" y="103" fill="#9999AA" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Dynamic Routing</text>
  </g>

  <!-- Eureka Registry (Top Left) -->
  <g transform="translate(240, 45)">
    <rect width="120" height="45" rx="10" fill="#11111D" stroke="#252536" stroke-width="1.5" />
    <circle cx="20" cy="22" r="5" fill="#10B981" />
    <text x="32" y="26" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Eureka Server</text>
  </g>

  <!-- Microservice 1: Product -->
  <g transform="translate(470, 80)">
    <rect width="130" height="80" rx="12" fill="#11111D" stroke="#252536" stroke-width="1.5" />
    <circle cx="22" cy="25" r="4" fill="#20C5E8" />
    <text x="34" y="29" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">SERVICE</text>
    <text x="65" y="55" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Product Service</text>
  </g>
  <g transform="translate(640, 95)">
    <rect width="80" height="50" rx="8" fill="#171727" stroke="#252536" stroke-width="1" />
    <text x="40" y="30" fill="#9999AA" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">MySQL DB</text>
  </g>

  <!-- Microservice 2: Order -->
  <g transform="translate(470, 185)">
    <rect width="130" height="80" rx="12" fill="#11111D" stroke="#20C5E8" stroke-width="1.5" />
    <circle cx="22" cy="25" r="4" fill="#20C5E8" />
    <text x="34" y="29" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">SERVICE</text>
    <text x="65" y="55" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Order Service</text>
  </g>
  <g transform="translate(640, 200)">
    <rect width="80" height="50" rx="8" fill="#171727" stroke="#252536" stroke-width="1" />
    <text x="40" y="30" fill="#9999AA" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">MySQL DB</text>
  </g>

  <!-- Microservice 3: Inventory -->
  <g transform="translate(470, 290)">
    <rect width="130" height="80" rx="12" fill="#11111D" stroke="#252536" stroke-width="1.5" />
    <circle cx="22" cy="25" r="4" fill="#20C5E8" />
    <text x="34" y="29" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">SERVICE</text>
    <text x="65" y="55" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Inventory Service</text>
  </g>
  <g transform="translate(640, 305)">
    <rect width="80" height="50" rx="8" fill="#171727" stroke="#252536" stroke-width="1" />
    <text x="40" y="30" fill="#9999AA" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">MySQL DB</text>
  </g>
</svg>

