<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d1a" />
      <stop offset="100%" stop-color="#141428" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20C5E8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="#252536" stroke-width="2" />

  <!-- Grid lines -->
  <g opacity="0.15" stroke="#20C5E8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="225" r="160" fill="#20C5E8" opacity="0.08" filter="url(#glow)" />

  <!-- Mockup UI Window -->
  <g transform="translate(150, 75)">
    <!-- Window Frame -->
    <rect width="500" height="300" rx="16" fill="#11111D" stroke="#252536" stroke-width="2" />
    
    <!-- Window Bar -->
    <rect width="500" height="42" rx="16" fill="#171727" />
    <rect y="26" width="500" height="16" fill="#171727" />
    <line x1="0" y1="42" x2="500" y2="42" stroke="#252536" stroke-width="1.5" />
    
    <!-- Window Dots -->
    <circle cx="25" cy="21" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="42" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="59" cy="21" r="5" fill="#10B981" opacity="0.8" />
    
    <text x="250" y="26" fill="#9999AA" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" font-weight="500">
      MEMS – Dashboard &amp; RBAC Control
    </text>

    <!-- Sidebar -->
    <rect x="18" y="58" width="100" height="225" rx="10" fill="#0C0D18" stroke="#252536" stroke-width="1" />
    <rect x="28" y="75" width="80" height="12" rx="4" fill="#20C5E8" opacity="0.4" />
    <rect x="28" y="98" width="60" height="8" rx="4" fill="#252536" />
    <rect x="28" y="118" width="70" height="8" rx="4" fill="#252536" />
    <rect x="28" y="138" width="55" height="8" rx="4" fill="#252536" />
    <rect x="28" y="158" width="65" height="8" rx="4" fill="#252536" />

    <!-- Content Cards -->
    <rect x="135" y="58" width="165" height="80" rx="12" fill="#171727" stroke="#252536" stroke-width="1" />
    <text x="150" y="82" fill="#9999AA" font-family="'Inter', sans-serif" font-size="11">Total Students</text>
    <text x="150" y="112" fill="#F5F5FA" font-family="'Inter', sans-serif" font-size="20" font-weight="700">1,248</text>
    <rect x="250" y="74" width="36" height="18" rx="9" fill="#20C5E8" opacity="0.2" />
    <text x="268" y="87" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">+14%</text>

    <rect x="315" y="58" width="165" height="80" rx="12" fill="#171727" stroke="#252536" stroke-width="1" />
    <text x="330" y="82" fill="#9999AA" font-family="'Inter', sans-serif" font-size="11">Active Classes</text>
    <text x="330" y="112" fill="#20C5E8" font-family="'Inter', sans-serif" font-size="20" font-weight="700">32 Classes</text>

    <!-- Graph / Table Mockup -->
    <rect x="135" y="150" width="345" height="133" rx="12" fill="#171727" stroke="#252536" stroke-width="1" />
    <path d="M155,240 Q 210,190 270,215 T 390,175 T 460,195" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" />
    <circle cx="270" cy="215" r="4" fill="#20C5E8" />
    <circle cx="390" cy="175" r="4" fill="#20C5E8" />
    <circle cx="460" cy="195" r="4" fill="#20C5E8" />
  </g>
</svg>

