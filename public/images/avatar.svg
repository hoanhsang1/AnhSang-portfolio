<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111D" />
      <stop offset="100%" stop-color="#1A1A2E" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C5E8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="url(#ringGrad)" stroke-width="4" />
  <circle cx="200" cy="200" r="175" fill="#0C0D18" stroke="#252536" stroke-width="2" />

  <!-- Initials / Silhouette -->
  <text x="200" y="185" fill="#20C5E8" font-family="'Inter', 'Manrope', sans-serif" font-size="72" font-weight="800" text-anchor="middle" letter-spacing="-2">
    HAS
  </text>
  <text x="200" y="235" fill="#F5F5FA" font-family="'Inter', 'Manrope', sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="3">
    HỒ ANH SANG
  </text>
  <text x="200" y="265" fill="#9999AA" font-family="'Inter', sans-serif" font-size="14" font-weight="500" text-anchor="middle">
    Fullstack Developer
  </text>

  <!-- Glowing indicator -->
  <circle cx="200" cy="305" r="5" fill="#10B981" />
  <text x="215" y="309" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Open to Work</text>
</svg>

